<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brawl Stars - Box Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bs-yellow: #ffce00;
      --bs-yellow-dark: #b88a00;
      --bs-blue: #0088ff;
      --bs-blue-dark: #004499;
      --bs-purple: #9d00ff;
      --bs-purple-dark: #580099;
      --bs-red: #ff2255;
      --bs-red-dark: #990022;
      --bs-green: #28d73b;
      --bs-green-dark: #12751d;
      
      --rarity-rare: #2bf03b;
      --rarity-super-rare: #00bfff;
      --rarity-epic: #d100ff;
      --rarity-mythic: #fe004a;
      --rarity-legendary: #fff000;
      --rarity-chromatic: #f3a800;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lilita One', cursive, sans-serif;
      background: #0f0c29;
      background: radial-gradient(circle at center, #2b1055 0%, #0d041a 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Top Bar Header */
    header {
      width: 100%;
      max-width: 1000px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      border-bottom: 4px solid #000;
      box-shadow: 0 8px 16px rgba(0,0,0,0.8);
      z-index: 10;
    }

    .logo {
      font-size: 1.8rem;
      color: var(--bs-yellow);
      text-shadow: 
        3px 3px 0 #000, -3px -3px 0 #000, 
        3px -3px 0 #000, -3px 3px 0 #000,
        0 4px 0 #b88a00;
      letter-spacing: 1px;
    }

    .currencies {
      display: flex;
      gap: 12px;
    }

    .stat-badge {
      background: #151124;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      box-shadow: 0 4px 0 #000;
      text-shadow: 2px 2px 0 #000;
    }

    /* Tab Buttons */
    nav {
      display: flex;
      gap: 15px;
      margin: 20px 0;
    }

    .bs-btn {
      background: linear-gradient(180deg, #ffea00 0%, #ff9900 100%);
      color: #fff;
      border: 4px solid #000;
      border-radius: 14px;
      padding: 10px 28px;
      font-family: inherit;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #000, inset 0 3px 0 rgba(255,255,255,0.6);
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      text-transform: uppercase;
      transform: skew(-6deg);
      transition: transform 0.1s;
    }

    .bs-btn:active {
      transform: skew(-6deg) translateY(6px);
      box-shadow: 0 0 0 #000;
    }

    .bs-btn.blue {
      background: linear-gradient(180deg, #00bfff 0%, #0055ff 100%);
    }

    .bs-btn.active {
      background: linear-gradient(180deg, #00ff66 0%, #00aa22 100%);
    }

    /* Main Panels */
    main {
      width: 100%;
      max-width: 1000px;
      flex: 1;
      padding: 10px 20px 40px;
    }

    .panel {
      display: none;
      width: 100%;
    }

    .panel.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Shop Grid */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .box-card {
      background: linear-gradient(180deg, #32215c 0%, #170d30 100%);
      border: 4px solid #000;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 0 #000;
      position: relative;
    }

    .box-title {
      font-size: 1.6rem;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      margin-bottom: 15px;
    }

    /* Vector SVG Art Sprites */
    .svg-icon {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 8px 0 #000);
      margin: 10px 0 20px;
      transition: transform 0.2s;
    }

    .box-card:hover .svg-icon {
      transform: scale(1.08) rotate(-2deg);
    }

    /* Brawler Collection Grid */
    .brawler-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
      width: 100%;
    }

    .brawler-card {
      background: #1a142b;
      border: 4px solid #000;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 0 #000;
      position: relative;
      opacity: 0.3;
      filter: grayscale(1);
      transition: opacity 0.3s, filter 0.3s;
    }

    .brawler-card.unlocked {
      opacity: 1;
      filter: grayscale(0);
    }

    .brawler-portrait {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      border: 3px solid #000;
      background: #2b2342;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 4px 0 #000;
      overflow: hidden;
    }

    .brawler-name {
      font-size: 1.1rem;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 6px;
    }

    .rarity-pill {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 8px;
      border: 2px solid #000;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000;
    }

    .rare { background: var(--rarity-rare); color: #000; }
    .super-rare { background: var(--rarity-super-rare); color: #000; }
    .epic { background: var(--rarity-epic); color: #fff; }
    .mythic { background: var(--rarity-mythic); color: #fff; }
    .legendary { background: var(--rarity-legendary); color: #000; }
    .chromatic { background: var(--rarity-chromatic); color: #000; }

    /* Fullscreen Opening Animation Overlay */
    #opening-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(8, 3, 20, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
      overflow: hidden;
    }

    /* Starburst Ray Effect */
    .starburst {
      position: absolute;
      width: 200vw;
      height: 200vh;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 206, 0, 0.15) 0deg 15deg,
        transparent 15deg 30deg
      );
      animation: rotateRays 20s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateRays {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .tap-counter {
      position: absolute;
      top: 8%;
      font-size: 2.2rem;
      color: var(--bs-yellow);
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      z-index: 2;
    }

    .stage-box-wrapper {
      z-index: 2;
      animation: wobbleBox 0.5s infinite alternate ease-in-out;
    }

    @keyframes wobbleBox {
      0% { transform: scale(1) rotate(-4deg); }
      100% { transform: scale(1.1) rotate(4deg); }
    }

    .reward-modal {
      z-index: 2;
      background: linear-gradient(180deg, #2a184e 0%, #100624 100%);
      border: 5px solid #000;
      border-radius: 24px;
      padding: 35px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 60px rgba(255, 206, 0, 0.4), 0 10px 0 #000;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      min-width: 280px;
    }

    @keyframes popIn {
      0% { transform: scale(0.1); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .reward-val {
      font-size: 3rem;
      color: var(--bs-yellow);
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      margin-top: 10px;
    }

    .reward-title {
      font-size: 1.8rem;
      text-shadow: 2px 2px 0 #000;
    }
  </style>
</head>
<body>

  <!-- Top Header Stats -->
  <header>
    <div class="logo">BOX SIMULATOR</div>
    <div class="currencies">
      <div class="stat-badge">
        <svg class="svg-icon" style="width:28px; height:28px; margin:0;" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="#ffcc00" stroke="#000" stroke-width="8"/>
          <circle cx="50" cy="50" r="28" fill="#ff9900" stroke="#000" stroke-width="6"/>
          <text x="50" y="62" font-size="36" font-family="Lilita One" fill="#fff" text-anchor="middle" stroke="#000" stroke-width="3">C</text>
        </svg>
        <span id="cnt-coins">0</span>
      </div>

      <div class="stat-badge">
        <svg class="svg-icon" style="width:28px; height:28px; margin:0;" viewBox="0 0 100 100">
          <polygon points="50,10 85,35 70,85 30,85 15,35" fill="#00ff88" stroke="#000" stroke-width="8"/>
          <polygon points="50,22 73,40 60,75 40,75 27,40" fill="#00b359"/>
        </svg>
        <span id="cnt-gems">0</span>
      </div>

      <div class="stat-badge">
        <svg class="svg-icon" style="width:28px; height:28px; margin:0;" viewBox="0 0 100 100">
          <polygon points="55,10 20,55 45,55 35,90 80,45 55,45" fill="#00ccff" stroke="#000" stroke-width="8"/>
        </svg>
        <span id="cnt-power">0</span>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav>
    <button class="bs-btn active" onclick="showTab('shop')">Boxes</button>
    <button class="bs-btn blue" onclick="showTab('brawlers')">Brawlers</button>
  </nav>

  <!-- Main Content Areas -->
  <main>
    <!-- Shop Panel -->
    <div id="panel-shop" class="panel active">
      <div class="shop-grid">
        <!-- Brawl Box -->
        <div class="box-card">
          <div class="box-title">Brawl Box</div>
          <svg class="svg-icon" viewBox="0 0 100 100">
            <rect x="15" y="35" width="70" height="50" rx="10" fill="#0088ff" stroke="#000" stroke-width="7"/>
            <rect x="10" y="22" width="80" height="20" rx="6" fill="#00bfff" stroke="#000" stroke-width="7"/>
            <rect x="42" y="45" width="16" height="22" rx="4" fill="#ffcc00" stroke="#000" stroke-width="5"/>
          </svg>
          <button class="bs-btn" onclick="openBox('brawl')">FREE</button>
        </div>

        <!-- Big Box -->
        <div class="box-card">
          <div class="box-title">Big Box</div>
          <svg class="svg-icon" viewBox="0 0 100 100">
            <rect x="15" y="35" width="70" height="50" rx="10" fill="#a800ff" stroke="#000" stroke-width="7"/>
            <rect x="10" y="22" width="80" height="20" rx="6" fill="#d100ff" stroke="#000" stroke-width="7"/>
            <circle cx="50" cy="55" r="12" fill="#ffcc00" stroke="#000" stroke-width="5"/>
          </svg>
          <button class="bs-btn" onclick="openBox('big')">FREE</button>
        </div>

        <!-- Mega Box -->
        <div class="box-card">
          <div class="box-title">Mega Box</div>
          <svg class="svg-icon" viewBox="0 0 100 100">
            <rect x="12" y="32" width="76" height="54" rx="10" fill="#ffcc00" stroke="#000" stroke-width="7"/>
            <rect x="8" y="18" width="84" height="22" rx="6" fill="#ff9900" stroke="#000" stroke-width="7"/>
            <polygon points="50,42 55,54 68,54 57,62 61,74 50,66 39,74 43,62 32,54 45,54" fill="#0088ff" stroke="#000" stroke-width="4"/>
          </svg>
          <button class="bs-btn" onclick="openBox('mega')">FREE</button>
        </div>

        <!-- Omega Box -->
        <div class="box-card">
          <div class="box-title">Omega Box</div>
          <svg class="svg-icon" viewBox="0 0 100 100">
            <rect x="12" y="32" width="76" height="54" rx="10" fill="#ff0055" stroke="#000" stroke-width="7"/>
            <rect x="8" y="18" width="84" height="22" rx="6" fill="#ff3300" stroke="#000" stroke-width="7"/>
            <circle cx="50" cy="55" r="14" fill="#ffcc00" stroke="#000" stroke-width="5"/>
            <path d="M 44,55 L 56,55" stroke="#000" stroke-width="5"/>
          </svg>
          <button class="bs-btn" onclick="openBox('omega')">FREE</button>
        </div>
      </div>
    </div>

    <!-- Brawlers Panel -->
    <div id="panel-brawlers" class="panel">
      <div id="brawlers-list" class="brawler-grid"></div>
    </div>
  </main>

  <!-- Fullscreen Box Opening Screen -->
  <div id="opening-modal" onclick="advanceOpening()">
    <div class="starburst"></div>
    <div id="tap-count" class="tap-counter">Items Remaining: 3</div>
    
    <div id="stage-box" class="stage-box-wrapper">
      <svg id="animated-box-svg" class="svg-icon" style="width: 220px; height: 220px;" viewBox="0 0 100 100"></svg>
    </div>

    <div id="stage-reward" style="display: none;"></div>
  </div>

  <script>
    // Audio Synthesizer
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playTone(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Catalog of Brawlers
    const CATALOG = [
      { id: 'shelly', name: 'Shelly', rarity: 'rare', avatarColor: '#e67e22' },
      { id: 'nita', name: 'Nita', rarity: 'rare', avatarColor: '#795548' },
      { id: 'colt', name: 'Colt', rarity: 'rare', avatarColor: '#e74c3c' },
      { id: 'bull', name: 'Bull', rarity: 'rare', avatarColor: '#34495e' },
      { id: 'el_primo', name: 'El Primo', rarity: 'super-rare', avatarColor: '#2980b9' },
      { id: 'barley', name: 'Barley', rarity: 'super-rare', avatarColor: '#f39c12' },
      { id: 'poco', name: 'Poco', rarity: 'super-rare', avatarColor: '#2ecc71' },
      { id: 'rico', name: 'Rico', rarity: 'epic', avatarColor: '#9b59b6' },
      { id: 'piper', name: 'Piper', rarity: 'epic', avatarColor: '#3498db' },
      { id: 'pam', name: 'Pam', rarity: 'epic', avatarColor: '#e74c3c' },
      { id: 'mortis', name: 'Mortis', rarity: 'mythic', avatarColor: '#8e44ad' },
      { id: 'tara', name: 'Tara', rarity: 'mythic', avatarColor: '#c0392b' },
      { id: 'gene', name: 'Gene', rarity: 'mythic', avatarColor: '#d35400' },
      { id: 'spike', name: 'Spike', rarity: 'legendary', icon: '🌵', avatarColor: '#27ae60' },
      { id: 'crow', name: 'Crow', rarity: 'legendary', avatarColor: '#2c3e50' },
      { id: 'leon', name: 'Leon', rarity: 'legendary', avatarColor: '#16a085' },
      { id: 'gale', name: 'Gale', rarity: 'chromatic', avatarColor: '#bdc3c7' },
      { id: 'surge', name: 'Surge', rarity: 'chromatic', avatarColor: '#c0392b' }
    ];

    // Local Storage State
    let userState = {
      coins: 0,
      gems: 0,
      powerPoints: 0,
      unlocked: ['shelly']
    };

    function loadData() {
      const saved = localStorage.getItem('bs_box_sim_perfect');
      if (saved) {
        try { userState = JSON.parse(saved); } catch(e){}
      }
      refreshUI();
    }

    function saveData() {
      localStorage.setItem('bs_box_sim_perfect', JSON.stringify(userState));
      refreshUI();
    }

    function refreshUI() {
      document.getElementById('cnt-coins').innerText = userState.coins;
      document.getElementById('cnt-gems').innerText = userState.gems;
      document.getElementById('cnt-power').innerText = userState.powerPoints;
      buildBrawlerGrid();
    }

    function showTab(tab) {
      document.querySelectorAll('.bs-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      if (tab === 'shop') {
        document.querySelectorAll('.bs-btn')[0].classList.add('active');
        document.getElementById('panel-shop').classList.add('active');
      } else {
        document.querySelectorAll('.bs-btn')[1].classList.add('active');
        document.getElementById('panel-brawlers').classList.add('active');
      }
    }

    function buildBrawlerGrid() {
      const container = document.getElementById('brawlers-list');
      container.innerHTML = '';

      CATALOG.forEach(brawler => {
        const isUnlocked = userState.unlocked.includes(brawler.id);
        const card = document.createElement('div');
        card.className = `brawler-card ${isUnlocked ? 'unlocked' : ''}`;
        card.innerHTML = `
          <div class="brawler-portrait" style="background:${brawler.avatarColor}">
            <svg viewBox="0 0 100 100" style="width:60px; height:60px;">
              <circle cx="50" cy="40" r="22" fill="#fff" stroke="#000" stroke-width="6"/>
              <path d="M 20,85 Q 50,55 80,85" fill="#fff" stroke="#000" stroke-width="6"/>
            </svg>
          </div>
          <div class="brawler-name">${brawler.name}</div>
          <div class="rarity-pill ${brawler.rarity}">${brawler.rarity.replace('-', ' ')}</div>
        `;
        container.appendChild(card);
      });
    }

    // Opening Drops Engine
    let activeRewards = [];
    let currentStep = 0;

    const BOX_SVGS = {
      brawl: `<rect x="15" y="35" width="70" height="50" rx="10" fill="#0088ff" stroke="#000" stroke-width="7"/><rect x="10" y="22" width="80" height="20" rx="6" fill="#00bfff" stroke="#000" stroke-width="7"/><rect x="42" y="45" width="16" height="22" rx="4" fill="#ffcc00" stroke="#000" stroke-width="5"/>`,
      big: `<rect x="15" y="35" width="70" height="50" rx="10" fill="#a800ff" stroke="#000" stroke-width="7"/><rect x="10" y="22" width="80" height="20" rx="6" fill="#d100ff" stroke="#000" stroke-width="7"/><circle cx="50" cy="55" r="12" fill="#ffcc00" stroke="#000" stroke-width="5"/>`,
      mega: `<rect x="12" y="32" width="76" height="54" rx="10" fill="#ffcc00" stroke="#000" stroke-width="7"/><rect x="8" y="18" width="84" height="22" rx="6" fill="#ff9900" stroke="#000" stroke-width="7"/><polygon points="50,42 55,54 68,54 57,62 61,74 50,66 39,74 43,62 32,54 45,54" fill="#0088ff" stroke="#000" stroke-width="4"/>`,
      omega: `<rect x="12" y="32" width="76" height="54" rx="10" fill="#ff0055" stroke="#000" stroke-width="7"/><rect x="8" y="18" width="84" height="22" rx="6" fill="#ff3300" stroke="#000" stroke-width="7"/><circle cx="50" cy="55" r="14" fill="#ffcc00" stroke="#000" stroke-width="5"/>`
    };

    function openBox(type) {
      playTone(523, 'square', 0.15);
      
      const count = type === 'brawl' ? 2 : type === 'big' ? 3 : type === 'mega' ? 5 : 8;
      activeRewards = createDrops(type, count);
      currentStep = 0;

      const modal = document.getElementById('opening-modal');
      document.getElementById('animated-box-svg').innerHTML = BOX_SVGS[type];
      document.getElementById('tap-count').innerText = `Items Remaining: ${activeRewards.length}`;
      document.getElementById('stage-box').style.display = 'block';
      document.getElementById('stage-reward').style.display = 'none';
      modal.style.display = 'flex';
    }

    function createDrops(type, targetCount) {
      const mult = type === 'brawl' ? 1 : type === 'big' ? 3 : type === 'mega' ? 10 : 25;
      const drops = [];

      drops.push({
        type: 'coin',
        amount: Math.floor((Math.random() * 25 + 20) * mult),
        title: 'Coins',
        svg: `<svg class="svg-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#ffcc00" stroke="#000" stroke-width="8"/><circle cx="50" cy="50" r="28" fill="#ff9900" stroke="#000" stroke-width="6"/><text x="50" y="62" font-size="36" font-family="Lilita One" fill="#fff" text-anchor="middle" stroke="#000" stroke-width="3">C</text></svg>`
      });

      drops.push({
        type: 'power',
        amount: Math.floor((Math.random() * 15 + 10) * mult),
        title: 'Power Points',
        svg: `<svg class="svg-icon" viewBox="0 0 100 100"><polygon points="55,10 20,55 45,55 35,90 80,45 55,45" fill="#00ccff" stroke="#000" stroke-width="8"/></svg>`
      });

      if (Math.random() < 0.4) {
        drops.push({
          type: 'gem',
          amount: Math.floor((Math.random() * 5 + 3) * (type === 'mega' || type === 'omega' ? 2 : 1)),
          title: 'Gems',
          svg: `<svg class="svg-icon" viewBox="0 0 100 100"><polygon points="50,10 85,35 70,85 30,85 15,35" fill="#00ff88" stroke="#000" stroke-width="8"/><polygon points="50,22 73,40 60,75 40,75 27,40" fill="#00b359"/></svg>`
        });
      }

      const newBrawler = rollBrawler();
      if (newBrawler) {
        drops.push({
          type: 'brawler',
          brawler: newBrawler,
          title: newBrawler.name,
          svg: `<div class="brawler-portrait" style="width:100px; height:100px; background:${newBrawler.avatarColor}"><svg viewBox="0 0 100 100" style="width:70px; height:70px;"><circle cx="50" cy="40" r="22" fill="#fff" stroke="#000" stroke-width="6"/><path d="M 20,85 Q 50,55 80,85" fill="#fff" stroke="#000" stroke-width="6"/></svg></div>`
        });
      }

      return drops;
    }

    function rollBrawler() {
      const locked = CATALOG.filter(b => !userState.unlocked.includes(b.id));
      if (locked.length === 0) return null;

      const roll = Math.random();
      let selectedRarity = null;

      if (roll < 0.04) selectedRarity = 'chromatic';
      else if (roll < 0.08) selectedRarity = 'legendary';
      else if (roll < 0.15) selectedRarity = 'mythic';
      else if (roll < 0.30) selectedRarity = 'epic';
      else if (roll < 0.55) selectedRarity = 'super-rare';
      else if (roll < 0.85) selectedRarity = 'rare';

      if (!selectedRarity) return null;

      const candidates = locked.filter(b => b.rarity === selectedRarity);
      return candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : null;
    }

    function advanceOpening() {
      const boxStage = document.getElementById('stage-box');
      const rewardStage = document.getElementById('stage-reward');
      const tapCounter = document.getElementById('tap-count');

      if (boxStage.style.display !== 'none') {
        boxStage.style.display = 'none';
        rewardStage.style.display = 'flex';
        renderCurrentReward();
      } else {
        currentStep++;
        if (currentStep < activeRewards.length) {
          renderCurrentReward();
        } else {
          document.getElementById('opening-modal').style.display = 'none';
          saveData();
        }
      }

      const remaining = activeRewards.length - currentStep;
      tapCounter.innerText = remaining > 0 ? `Items Remaining: ${remaining}` : '';
    }

    function renderCurrentReward() {
      const drop = activeRewards[currentStep];
      const rewardStage = document.getElementById('stage-reward');

      if (drop.type === 'coin') userState.coins += drop.amount;
      if (drop.type === 'gem') userState.gems += drop.amount;
      if (drop.type === 'power') userState.powerPoints += drop.amount;
      if (drop.type === 'brawler') userState.unlocked.push(drop.brawler.id);

      playTone(drop.type === 'brawler' ? 880 : 600, 'triangle', 0.2);

      rewardStage.innerHTML = `
        <div class="reward-modal">
          ${drop.svg}
          <div class="reward-val">${drop.amount ? '+' + drop.amount : ''}</div>
          <div class="reward-title">${drop.title}</div>
          ${drop.brawler ? `<div class="rarity-pill ${drop.brawler.rarity}" style="margin-top:12px;">${drop.brawler.rarity}</div>` : ''}
        </div>
      `;
    }

    // Init
    loadData();
  </script>
</body>
</html>
