<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Simulator - Brawl Stars Gifts & Chests Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bs-yellow: #ffcc00;
      --bs-yellow-dark: #cc9900;
      --bs-blue: #0088ff;
      --bs-blue-dark: #0055bb;
      --bs-purple: #a800ff;
      --bs-red: #ff2255;
      
      --rarity-rare: #2bf03b;
      --rarity-super-rare: #00bfff;
      --rarity-epic: #d100ff;
      --rarity-mythic: #fe004a;
      --rarity-legendary: #fff000;
      --rarity-chromatic: #f3a800;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lilita One', cursive, sans-serif;
      background: radial-gradient(circle at center, #2b1055 0%, #0f051d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Top Stats Bar */
    header {
      width: 100%;
      max-width: 1100px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      border-bottom: 5px solid #000;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
      z-index: 10;
    }

    .brand {
      font-size: 1.8rem;
      color: var(--bs-yellow);
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      letter-spacing: 1px;
    }

    .currencies {
      display: flex;
      gap: 12px;
    }

    .stat-badge {
      background: #111;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      box-shadow: 0 4px 0 #000;
      text-shadow: 2px 2px 0 #000;
    }

    /* Navigation Tabs */
    nav {
      display: flex;
      gap: 15px;
      margin: 25px 0;
    }

    .bs-btn {
      background: var(--bs-yellow);
      color: #000;
      border: 4px solid #000;
      border-radius: 14px;
      padding: 12px 28px;
      font-family: inherit;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #000, inset 0 3px 0 rgba(255,255,255,0.5);
      text-transform: uppercase;
      transform: skew(-5deg);
      transition: transform 0.1s, background 0.1s;
    }

    .bs-btn:active {
      transform: skew(-5deg) translateY(6px);
      box-shadow: 0 0 0 #000;
    }

    .bs-btn.blue {
      background: var(--bs-blue);
      color: #fff;
    }

    .bs-btn.active {
      background: #00ff66;
      color: #000;
    }

    /* Panels Container */
    main {
      width: 100%;
      max-width: 1100px;
      flex: 1;
      padding: 10px 20px 40px;
    }

    .panel {
      display: none;
      width: 100%;
    }

    .panel.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Boxes / Shop Layout */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .box-card {
      background: linear-gradient(180deg, #2a1b4e 0%, #160c29 100%);
      border: 4px solid #000;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 0 #000;
      position: relative;
      overflow: hidden;
    }

    .box-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .box-title {
      font-size: 1.5rem;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 10px;
    }

    .box-sprite {
      width: 130px;
      height: 130px;
      margin: 15px 0;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      border: 4px solid #000;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.3), 0 6px 0 #000;
    }

    .box-brawl .box-sprite { background: linear-gradient(135deg, #0099ff, #0033aa); }
    .box-big .box-sprite { background: linear-gradient(135deg, #a800ff, #5500aa); }
    .box-mega .box-sprite { background: linear-gradient(135deg, #ffcc00, #ff6600); }
    .box-omega .box-sprite { background: linear-gradient(135deg, #ff0055, #aa0022); }

    /* Brawler Grid */
    .brawler-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      width: 100%;
    }

    .brawler-card {
      background: #1a162b;
      border: 4px solid #000;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 0 #000;
      position: relative;
      opacity: 0.35;
      filter: grayscale(1);
    }

    .brawler-card.unlocked {
      opacity: 1;
      filter: grayscale(0);
    }

    .brawler-portrait {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      border: 3px solid #000;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin-bottom: 8px;
      box-shadow: 0 4px 0 #000;
    }

    .brawler-name {
      font-size: 1.1rem;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 6px;
    }

    .rarity-pill {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 8px;
      border: 2px solid #000;
      text-transform: uppercase;
      font-weight: bold;
    }

    .rare { background: var(--rarity-rare); color: #000; }
    .super-rare { background: var(--rarity-super-rare); color: #000; }
    .epic { background: var(--rarity-epic); color: #fff; }
    .mythic { background: var(--rarity-mythic); color: #fff; }
    .legendary { background: var(--rarity-legendary); color: #000; }
    .chromatic { background: var(--rarity-chromatic); color: #000; }

    /* Interactive Box Opening Screen */
    #opening-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 2, 15, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
    }

    .tap-counter {
      position: absolute;
      top: 10%;
      font-size: 2rem;
      color: var(--bs-yellow);
      text-shadow: 3px 3px 0 #000;
    }

    #stage-box {
      font-size: 9rem;
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.7));
      animation: wobble 0.6s infinite alternate ease-in-out;
    }

    @keyframes wobble {
      0% { transform: scale(1) rotate(-3deg); }
      100% { transform: scale(1.08) rotate(3deg); }
    }

    .reward-modal {
      background: linear-gradient(180deg, #22143d 0%, #0d0618 100%);
      border: 5px solid #000;
      border-radius: 24px;
      padding: 35px 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 50px rgba(255, 204, 0, 0.5), 0 10px 0 #000;
      animation: popBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      min-width: 300px;
    }

    @keyframes popBounce {
      0% { transform: scale(0.1); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    .reward-icon {
      font-size: 5.5rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 6px 0 #000);
    }

    .reward-val {
      font-size: 2.8rem;
      color: var(--bs-yellow);
      text-shadow: 3px 3px 0 #000;
    }

    .reward-title {
      font-size: 1.8rem;
      text-shadow: 2px 2px 0 #000;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">BOX SIMULATOR</div>
    <div class="currencies">
      <div class="stat-badge"><span style="color:#ffcc00">🪙</span> <span id="cnt-coins">0</span></div>
      <div class="stat-badge"><span style="color:#00ff88">💎</span> <span id="cnt-gems">0</span></div>
      <div class="stat-badge"><span style="color:#00ccff">⚡</span> <span id="cnt-power">0</span></div>
    </div>
  </header>

  <nav>
    <button class="bs-btn active" onclick="showTab('shop')">Boxes</button>
    <button class="bs-btn blue" onclick="showTab('brawlers')">Brawlers</button>
  </nav>

  <main>
    <!-- Box Shop -->
    <div id="panel-shop" class="panel active">
      <div class="shop-grid">
        <div class="box-card box-brawl">
          <div class="box-title">Brawl Box</div>
          <div class="box-sprite">📦</div>
          <button class="bs-btn" onclick="openBox('brawl')">FREE</button>
        </div>

        <div class="box-card box-big">
          <div class="box-title">Big Box</div>
          <div class="box-sprite">🎁</div>
          <button class="bs-btn" onclick="openBox('big')">FREE</button>
        </div>

        <div class="box-card box-mega">
          <div class="box-title">Mega Box</div>
          <div class="box-sprite">🧰</div>
          <button class="bs-btn" onclick="openBox('mega')">FREE</button>
        </div>

        <div class="box-card box-omega">
          <div class="box-title">Omega Box</div>
          <div class="box-sprite">🏺</div>
          <button class="bs-btn" onclick="openBox('omega')">FREE</button>
        </div>
      </div>
    </div>

    <!-- Collection / Brawlers -->
    <div id="panel-brawlers" class="panel">
      <div id="brawlers-list" class="brawler-grid"></div>
    </div>
  </main>

  <!-- Interactive Opening Modal -->
  <div id="opening-modal" onclick="advanceOpening()">
    <div id="tap-count" class="tap-counter">Items Remaining: 3</div>
    <div id="stage-box">📦</div>
    <div id="stage-reward" style="display: none;"></div>
  </div>

  <script>
    // Audio Synthesizer
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playTone(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Brawler Catalog
    const CATALOG = [
      { id: 'shelly', name: 'Shelly', rarity: 'rare', icon: '🤠' },
      { id: 'nita', name: 'Nita', rarity: 'rare', icon: '🐻' },
      { id: 'colt', name: 'Colt', rarity: 'rare', icon: '🔫' },
      { id: 'bull', name: 'Bull', rarity: 'rare', icon: '🐂' },
      { id: 'el_primo', name: 'El Primo', rarity: 'super-rare', icon: '🥊' },
      { id: 'barley', name: 'Barley', rarity: 'super-rare', icon: '🍾' },
      { id: 'poco', name: 'Poco', rarity: 'super-rare', icon: '🎸' },
      { id: 'rico', name: 'Rico', rarity: 'epic', icon: '🤖' },
      { id: 'piper', name: 'Piper', rarity: 'epic', icon: '☂️' },
      { id: 'pam', name: 'Pam', rarity: 'epic', icon: '🔧' },
      { id: 'mortis', name: 'Mortis', rarity: 'mythic', icon: '🦇' },
      { id: 'tara', name: 'Tara', rarity: 'mythic', icon: '🔮' },
      { id: 'gene', name: 'Gene', rarity: 'mythic', icon: '🧞' },
      { id: 'spike', name: 'Spike', rarity: 'legendary', icon: '🌵' },
      { id: 'crow', name: 'Crow', rarity: 'legendary', icon: '🦅' },
      { id: 'leon', name: 'Leon', rarity: 'legendary', icon: '🦎' },
      { id: 'gale', name: 'Gale', rarity: 'chromatic', icon: '👴' },
      { id: 'surge', name: 'Surge', rarity: 'chromatic', icon: '🤖' }
    ];

    // Local Storage State
    let userState = {
      coins: 0,
      gems: 0,
      powerPoints: 0,
      unlocked: ['shelly']
    };

    function loadData() {
      const saved = localStorage.getItem('bs_box_sim_chests');
      if (saved) {
        try { userState = JSON.parse(saved); } catch(e){}
      }
      refreshUI();
    }

    function saveData() {
      localStorage.setItem('bs_box_sim_chests', JSON.stringify(userState));
      refreshUI();
    }

    function refreshUI() {
      document.getElementById('cnt-coins').innerText = userState.coins;
      document.getElementById('cnt-gems').innerText = userState.gems;
      document.getElementById('cnt-power').innerText = userState.powerPoints;
      buildBrawlerGrid();
    }

    function showTab(tab) {
      document.querySelectorAll('.bs-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      if (tab === 'shop') {
        document.querySelectorAll('.bs-btn')[0].classList.add('active');
        document.getElementById('panel-shop').classList.add('active');
      } else {
        document.querySelectorAll('.bs-btn')[1].classList.add('active');
        document.getElementById('panel-brawlers').classList.add('active');
      }
    }

    function buildBrawlerGrid() {
      const container = document.getElementById('brawlers-list');
      container.innerHTML = '';

      CATALOG.forEach(brawler => {
        const isUnlocked = userState.unlocked.includes(brawler.id);
        const card = document.createElement('div');
        card.className = `brawler-card ${isUnlocked ? 'unlocked' : ''}`;
        card.innerHTML = `
          <div class="brawler-portrait">${brawler.icon}</div>
          <div class="brawler-name">${brawler.name}</div>
          <div class="rarity-pill ${brawler.rarity}">${brawler.rarity.replace('-', ' ')}</div>
        `;
        container.appendChild(card);
      });
    }

    // Chest Drop Generation Logic
    let activeRewards = [];
    let currentStep = 0;

    function openBox(type) {
      playTone(523, 'square', 0.15);
      
      const count = type === 'brawl' ? 2 : type === 'big' ? 3 : type === 'mega' ? 5 : 8;
      activeRewards = createDrops(type, count);
      currentStep = 0;

      const modal = document.getElementById('opening-modal');
      const boxSprite = document.getElementById('stage-box');
      
      boxSprite.innerText = type === 'brawl' ? '📦' : type === 'big' ? '🎁' : type === 'mega' ? '🧰' : '🏺';
      document.getElementById('tap-count').innerText = `Items Remaining: ${activeRewards.length}`;
      document.getElementById('stage-box').style.display = 'block';
      document.getElementById('stage-reward').style.display = 'none';
      modal.style.display = 'flex';
    }

    function createDrops(type, targetCount) {
      const mult = type === 'brawl' ? 1 : type === 'big' ? 3 : type === 'mega' ? 10 : 25;
      const drops = [];

      // Coins
      drops.push({
        type: 'coin',
        amount: Math.floor((Math.random() * 25 + 20) * mult),
        title: 'Coins',
        icon: '🪙'
      });

      // Power Points
      drops.push({
        type: 'power',
        amount: Math.floor((Math.random() * 15 + 10) * mult),
        title: 'Power Points',
        icon: '⚡'
      });

      // Bonus Gems
      if (Math.random() < 0.4) {
        drops.push({
          type: 'gem',
          amount: Math.floor((Math.random() * 5 + 3) * (type === 'mega' || type === 'omega' ? 2 : 1)),
          title: 'Gems',
          icon: '💎'
        });
      }

      // New Brawler Check
      const newBrawler = rollBrawler();
      if (newBrawler) {
        drops.push({
          type: 'brawler',
          brawler: newBrawler,
          title: newBrawler.name,
          icon: newBrawler.icon
        });
      }

      return drops;
    }

    function rollBrawler() {
      const locked = CATALOG.filter(b => !userState.unlocked.includes(b.id));
      if (locked.length === 0) return null;

      const roll = Math.random();
      let selectedRarity = null;

      if (roll < 0.03) selectedRarity = 'chromatic';
      else if (roll < 0.06) selectedRarity = 'legendary';
      else if (roll < 0.12) selectedRarity = 'mythic';
      else if (roll < 0.25) selectedRarity = 'epic';
      else if (roll < 0.50) selectedRarity = 'super-rare';
      else if (roll < 0.80) selectedRarity = 'rare';

      if (!selectedRarity) return null;

      const candidates = locked.filter(b => b.rarity === selectedRarity);
      return candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : null;
    }

    function advanceOpening() {
      const boxStage = document.getElementById('stage-box');
      const rewardStage = document.getElementById('stage-reward');
      const tapCounter = document.getElementById('tap-count');

      if (boxStage.style.display !== 'none') {
        boxStage.style.display = 'none';
        rewardStage.style.display = 'flex';
        renderCurrentReward();
      } else {
        currentStep++;
        if (currentStep < activeRewards.length) {
          renderCurrentReward();
        } else {
          document.getElementById('opening-modal').style.display = 'none';
          saveData();
        }
      }

      const remaining = activeRewards.length - currentStep;
      tapCounter.innerText = remaining > 0 ? `Items Remaining: ${remaining}` : '';
    }

    function renderCurrentReward() {
      const drop = activeRewards[currentStep];
      const rewardStage = document.getElementById('stage-reward');

      if (drop.type === 'coin') userState.coins += drop.amount;
      if (drop.type === 'gem') userState.gems += drop.amount;
      if (drop.type === 'power') userState.powerPoints += drop.amount;
      if (drop.type === 'brawler') userState.unlocked.push(drop.brawler.id);

      playTone(drop.type === 'brawler' ? 880 : 600, 'triangle', 0.2);

      rewardStage.innerHTML = `
        <div class="reward-modal">
          <div class="reward-icon">${drop.icon}</div>
          <div class="reward-val">${drop.amount ? '+' + drop.amount : ''}</div>
          <div class="reward-title">${drop.title}</div>
          ${drop.brawler ? `<div class="rarity-pill ${drop.brawler.rarity}" style="margin-top:12px;">${drop.brawler.rarity}</div>` : ''}
        </div>
      `;
    }

    // Boot
    loadData();
  </script>
</body>
</html>
