<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brawl Stars - Box Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #1b263b 0%, #0d1117 100%);
      --brawl-yellow: #ffce00;
      --brawl-blue: #0077ff;
      --brawl-purple: #a800ff;
      --brawl-red: #ff3344;
      --rare-green: #2bf03b;
      --super-rare-blue: #00bfff;
      --epic-purple: #d100ff;
      --mythic-red: #fe004a;
      --legendary-yellow: #fff000;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lilita One', cursive, sans-serif;
      background: var(--bg-gradient);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Header Bar */
    header {
      width: 100%;
      max-width: 1000px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 4px solid #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .currencies {
      display: flex;
      gap: 15px;
    }

    .currency-card {
      background: #111;
      border: 3px solid #333;
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      text-shadow: 2px 2px #000;
    }

    .icon-coin { color: var(--brawl-yellow); }
    .icon-gem { color: #00ff88; }
    .icon-box { color: var(--brawl-blue); }

    /* Navigation */
    nav {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    .nav-btn {
      background: #333;
      color: #fff;
      border: 3px solid #000;
      border-radius: 10px;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      transition: transform 0.1s;
    }

    .nav-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #000;
    }

    .nav-btn.active {
      background: var(--brawl-blue);
      border-color: #0033aa;
    }

    /* Content Panels */
    main {
      width: 100%;
      max-width: 1000px;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .panel {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    .panel.active {
      display: flex;
    }

    /* Box Selection Grid */
    .box-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .box-card {
      background: #1e293b;
      border: 4px solid #000;
      border-radius: 18px;
      width: 260px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 0 #000;
      text-align: center;
    }

    .box-icon {
      width: 120px;
      height: 120px;
      margin: 15px 0;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      border: 4px solid #000;
      box-shadow: inset 0 0 15px rgba(255,255,255,0.2), 0 6px 0 #000;
      position: relative;
    }

    .brawl-box .box-icon { background: linear-gradient(135deg, #0088ff, #003399); }
    .big-box .box-icon { background: linear-gradient(135deg, #a800ff, #5500aa); }
    .mega-box .box-icon { background: linear-gradient(135deg, #ffcc00, #ff6600); }

    .open-btn {
      background: var(--rare-green);
      color: #000;
      border: 3px solid #000;
      border-radius: 10px;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #000;
      width: 100%;
      margin-top: 10px;
    }

    .open-btn:active {
      transform: translateY(5px);
      box-shadow: 0 0 0 #000;
    }

    /* Brawlers Inventory */
    .brawlers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
      width: 100%;
    }

    .brawler-card {
      background: #1f2937;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 5px 0 #000;
      position: relative;
      opacity: 0.4;
      filter: grayscale(1);
    }

    .brawler-card.unlocked {
      opacity: 1;
      filter: grayscale(0);
    }

    .brawler-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .brawler-name {
      font-size: 1.1rem;
      text-shadow: 2px 2px #000;
      margin-bottom: 4px;
    }

    .rarity-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #000;
      text-transform: uppercase;
    }

    .rare { background: var(--rare-green); color: #000; }
    .super-rare { background: var(--super-rare-blue); color: #000; }
    .epic { background: var(--epic-purple); color: #fff; }
    .mythic { background: var(--mythic-red); color: #fff; }
    .legendary { background: var(--legendary-yellow); color: #000; }

    /* Box Opening Overlay */
    #opening-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
    }

    #opening-box {
      font-size: 8rem;
      transition: transform 0.1s ease;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .tap-hint {
      margin-top: 20px;
      font-size: 1.5rem;
      color: var(--brawl-yellow);
      text-shadow: 2px 2px #000;
      animation: blink 0.8s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Reward Card Modal */
    .reward-card {
      background: #111827;
      border: 5px solid #000;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 30px rgba(255, 206, 0, 0.4);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      min-width: 280px;
    }

    @keyframes popIn {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .reward-icon {
      font-size: 5rem;
      margin-bottom: 10px;
    }

    .reward-amount {
      font-size: 2.5rem;
      color: var(--brawl-yellow);
      text-shadow: 3px 3px #000;
    }

    .reward-title {
      font-size: 1.8rem;
      margin-top: 5px;
      text-shadow: 2px 2px #000;
    }
  </style>
</head>
<body>

  <header>
    <div style="font-size: 1.5rem; text-shadow: 2px 2px #000;">BOX SIMULATOR</div>
    <div class="currencies">
      <div class="currency-card"><span class="icon-coin">🪙</span> <span id="coin-count">0</span></div>
      <div class="currency-card"><span class="icon-gem">💎</span> <span id="gem-count">0</span></div>
      <div class="currency-card"><span class="icon-box">📦</span> <span id="box-count">0</span></div>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('boxes')">Boxes</button>
    <button class="nav-btn" onclick="switchTab('brawlers')">Brawlers</button>
  </nav>

  <main>
    <!-- Shop / Boxes Panel -->
    <div id="boxes-panel" class="panel active">
      <div class="box-grid">
        <div class="box-card brawl-box">
          <h2>Brawl Box</h2>
          <div class="box-icon">📦</div>
          <p>Standard drop chances</p>
          <button class="open-btn" onclick="startBoxOpening('brawl')">FREE</button>
        </div>

        <div class="box-card big-box">
          <h2>Big Box</h2>
          <div class="box-icon">🎁</div>
          <p>3x rewards of a Brawl Box</p>
          <button class="open-btn" onclick="startBoxOpening('big')">FREE</button>
        </div>

        <div class="box-card mega-box">
          <h2>Mega Box</h2>
          <div class="box-icon">🧰</div>
          <p>10x rewards of a Brawl Box</p>
          <button class="open-btn" onclick="startBoxOpening('mega')">FREE</button>
        </div>
      </div>
    </div>

    <!-- Inventory Panel -->
    <div id="brawlers-panel" class="panel">
      <div id="brawlers-container" class="brawlers-grid"></div>
    </div>
  </main>

  <!-- Box Opening Overlay -->
  <div id="opening-overlay" onclick="handleTap()">
    <div id="opening-stage">
      <div id="opening-box">📦</div>
      <div class="tap-hint">TAP TO OPEN!</div>
    </div>
    <div id="reward-stage" style="display: none;"></div>
  </div>

  <script>
    // Audio Synth Context
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(freq, duration, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Brawler Registry Data
    const BRAWLERS = [
      { id: 'shelly', name: 'Shelly', rarity: 'rare', icon: '🤠' },
      { id: 'nita', name: 'Nita', rarity: 'rare', icon: '🐻' },
      { id: 'colt', name: 'Colt', rarity: 'rare', icon: '🔫' },
      { id: 'bull', name: 'Bull', rarity: 'rare', icon: '🐂' },
      { id: 'el_primo', name: 'El Primo', rarity: 'super-rare', icon: '🥊' },
      { id: 'barley', name: 'Barley', rarity: 'super-rare', icon: '🍾' },
      { id: 'poco', name: 'Poco', rarity: 'super-rare', icon: '🎸' },
      { id: 'rosa', name: 'Rosa', rarity: 'super-rare', icon: '🥊' },
      { id: 'rico', name: 'Rico', rarity: 'epic', icon: '🤖' },
      { id: 'darryl', name: 'Darryl', rarity: 'epic', icon: '🛢️' },
      { id: 'piper', name: 'Piper', rarity: 'epic', icon: '☂️' },
      { id: 'pam', name: 'Pam', rarity: 'epic', icon: '🔧' },
      { id: 'mortis', name: 'Mortis', rarity: 'mythic', icon: '🦇' },
      { id: 'tara', name: 'Tara', rarity: 'mythic', icon: '🔮' },
      { id: 'gene', name: 'Gene', rarity: 'mythic', icon: '🧞' },
      { id: 'spike', name: 'Spike', rarity: 'legendary', icon: '🌵' },
      { id: 'crow', name: 'Crow', rarity: 'legendary', icon: '🦅' },
      { id: 'leon', name: 'Leon', rarity: 'legendary', icon: '🦎' }
    ];

    // State Management
    let state = {
      coins: 0,
      gems: 0,
      boxesOpened: 0,
      unlockedBrawlers: ['shelly']
    };

    function loadState() {
      const saved = localStorage.getItem('bs_box_sim_save');
      if (saved) {
        try { state = JSON.parse(saved); } catch(e){}
      }
      updateUI();
    }

    function saveState() {
      localStorage.setItem('bs_box_sim_save', JSON.stringify(state));
      updateUI();
    }

    function updateUI() {
      document.getElementById('coin-count').innerText = state.coins;
      document.getElementById('gem-count').innerText = state.gems;
      document.getElementById('box-count').innerText = state.boxesOpened;
      renderBrawlers();
    }

    // Tab Switching
    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));

      if (tabName === 'boxes') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('boxes-panel').classList.add('active');
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('brawlers-panel').classList.add('active');
      }
    }

    // Render Inventory
    function renderBrawlers() {
      const container = document.getElementById('brawlers-container');
      container.innerHTML = '';

      BRAWLERS.forEach(brawler => {
        const isUnlocked = state.unlockedBrawlers.includes(brawler.id);
        const card = document.createElement('div');
        card.className = `brawler-card ${isUnlocked ? 'unlocked' : ''}`;
        card.innerHTML = `
          <div class="brawler-avatar">${brawler.icon}</div>
          <div class="brawler-name">${brawler.name}</div>
          <div class="rarity-badge ${brawler.rarity}">${brawler.rarity.replace('-', ' ')}</div>
        `;
        container.appendChild(card);
      });
    }

    // Box Opening Engine
    let currentRewards = [];
    let rewardIndex = 0;

    function startBoxOpening(boxType) {
      playSound(440, 0.1);
      state.boxesOpened++;
      currentRewards = generateRewards(boxType);
      rewardIndex = 0;

      const overlay = document.getElementById('opening-overlay');
      const boxVisual = document.getElementById('opening-box');
      
      boxVisual.innerText = boxType === 'brawl' ? '📦' : boxType === 'big' ? '🎁' : '🧰';
      document.getElementById('opening-stage').style.display = 'flex';
      document.getElementById('reward-stage').style.display = 'none';
      overlay.style.display = 'flex';
    }

    function generateRewards(type) {
      const multiplier = type === 'brawl' ? 1 : type === 'big' ? 3 : 10;
      const rewards = [];

      // 1. Coins
      const coins = Math.floor((Math.random() * 20 + 15) * multiplier);
      rewards.push({ type: 'coin', amount: coins, title: 'Coins', icon: '🪙' });

      // 2. Gems Chance
      if (Math.random() < 0.25) {
        const gems = Math.floor((Math.random() * 5 + 3) * (type === 'mega' ? 2 : 1));
        rewards.push({ type: 'gem', amount: gems, title: 'Gems', icon: '💎' });
      }

      // 3. Brawler Chance
      const rolledBrawler = rollBrawler();
      if (rolledBrawler) {
        rewards.push({ type: 'brawler', brawler: rolledBrawler, title: rolledBrawler.name, icon: rolledBrawler.icon });
      }

      return rewards;
    }

    function rollBrawler() {
      const locked = BRAWLERS.filter(b => !state.unlockedBrawlers.includes(b.id));
      if (locked.length === 0) return null;

      const rand = Math.random();
      let targetRarity = null;

      if (rand < 0.02) targetRarity = 'legendary';
      else if (rand < 0.06) targetRarity = 'mythic';
      else if (rand < 0.15) targetRarity = 'epic';
      else if (rand < 0.35) targetRarity = 'super-rare';
      else if (rand < 0.65) targetRarity = 'rare';

      if (!targetRarity) return null;

      const available = locked.filter(b => b.rarity === targetRarity);
      if (available.length > 0) {
        return available[Math.floor(Math.random() * available.length)];
      }
      return null;
    }

    function handleTap() {
      const stage = document.getElementById('opening-stage');
      const rewardStage = document.getElementById('reward-stage');

      if (stage.style.display !== 'none') {
        stage.style.display = 'none';
        rewardStage.style.display = 'flex';
        showNextReward();
      } else {
        rewardIndex++;
        if (rewardIndex < currentRewards.length) {
          showNextReward();
        } else {
          document.getElementById('opening-overlay').style.display = 'none';
          saveState();
        }
      }
    }

    function showNextReward() {
      playSound(600 + (rewardIndex * 100), 0.15);
      const reward = currentRewards[rewardIndex];
      const rewardStage = document.getElementById('reward-stage');

      if (reward.type === 'coin') state.coins += reward.amount;
      if (reward.type === 'gem') state.gems += reward.amount;
      if (reward.type === 'brawler') state.unlockedBrawlers.push(reward.brawler.id);

      rewardStage.innerHTML = `
        <div class="reward-card">
          <div class="reward-icon">${reward.icon}</div>
          <div class="reward-amount">${reward.amount ? '+' + reward.amount : ''}</div>
          <div class="reward-title">${reward.title}</div>
          ${reward.brawler ? `<div class="rarity-badge ${reward.brawler.rarity}" style="margin-top:10px;">${reward.brawler.rarity}</div>` : ''}
        </div>
      `;
    }

    // Initialize App
    loadState();
  </script>
</body>
</html>
