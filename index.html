<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Box Simulator</title>
    <style>
        /* Modern CSS Reset & Fonts */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Arial Black', Impact, sans-serif;
        }

        body {
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Main Game Screen Frame */
        #game-container {
            width: 100vw;
            max-width: 1200px;
            height: 100vh;
            max-height: 675px;
            background: linear-gradient(135deg, #2b1055, #7597de);
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Top Header Bar */
        #top-bar {
            height: 60px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .currency-container {
            display: flex;
            gap: 15px;
        }

        .currency {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            color: #ffd700;
            text-shadow: 2px 2px 0 #000;
        }

        /* Main Display Area */
        #main-view {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tab Content Views */
        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 20px;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Main Menu Brawler View */
        #brawler-display {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        #brawler-img {
            width: 220px;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        #brawler-name {
            font-size: 32px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 #000;
            margin-top: 10px;
        }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .shop-card {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #ffcc00;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .shop-card:hover {
            transform: scale(1.05);
            background: rgba(255, 204, 0, 0.2);
        }

        .shop-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #000;
        }

        .free-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e7e34;
        }

        /* Sidebar Navigation */
        #sidebar {
            position: absolute;
            left: 20px;
            top: 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .nav-btn {
            width: 120px;
            padding: 12px;
            background: #ff9900;
            color: white;
            border: 3px solid #fff;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 5px 0 #cc7a00;
            transition: all 0.1s;
        }

        .nav-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #cc7a00;
        }

        /* Drop Modal (Opening Screen) */
        #modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #modal-content {
            text-align: center;
            animation: popIn 0.3s ease-out;
        }

        #modal-title {
            font-size: 36px;
            color: #ff0;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 15px;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="top-bar">
            <div class="currency-container">
                <div class="currency">🪙 <span id="coins-display">0</span></div>
                <div class="currency">💎 <span id="gems-display">0</span></div>
            </div>
            <div id="player-info" style="text-shadow: 2px 2px 0 #000;">
                Brawlers Unlocked: <span id="unlocked-count">1</span>/5
            </div>
        </div>

        <div id="sidebar">
            <button class="nav-btn" onclick="showTab('home-tab')">HOME</button>
            <button class="nav-btn" onclick="showTab('shop-tab')">SHOP</button>
            <button class="nav-btn" onclick="showTab('brawlers-tab')">BRAWLERS</button>
        </div>

        <div id="main-view">
            <div id="home-tab" class="tab-content active">
                <div id="brawler-display">
                    <div id="brawler-name">Shelly</div>
                    <div style="font-size: 14px; color: #aaa; text-shadow: 1px 1px 0 #000;">POWER LEVEL <span id="brawler-level">1</span></div>
                </div>
            </div>

            <div id="shop-tab" class="tab-content">
                <h2 style="margin-bottom: 20px; text-shadow: 2px 2px 0 #000;">FREE DROPS & BOXES</h2>
                <div class="shop-grid">
                    <div class="shop-card" onclick="openDrop('Brawl Box')">
                        <h3>📦 BRAWL BOX</h3>
                        <p>Contains Coins & Brawlers</p>
                        <button class="free-btn">FREE</button>
                    </div>
                    <div class="shop-card" onclick="openDrop('Mega Box')">
                        <h3>🎁 MEGA BOX</h3>
                        <p>10x Items Inside!</p>
                        <button class="free-btn">FREE</button>
                    </div>
                    <div class="shop-card" onclick="openDrop('Starr Drop')">
                        <h3>⭐ STARR DROP</h3>
                        <p>Random Rewards!</p>
                        <button class="free-btn">FREE</button>
                    </div>
                    <div class="shop-card" onclick="openDrop('Angelic Drop')">
                        <h3>👼 ANGELIC DROP</h3>
                        <p>Mythic & Legendary Loot</p>
                        <button class="free-btn">FREE</button>
                    </div>
                </div>
            </div>

            <div id="brawlers-tab" class="tab-content">
                <h2 style="margin-bottom: 20px; text-shadow: 2px 2px 0 #000;">MY BRAWLERS</h2>
                <div id="brawlers-list" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                    </div>
            </div>
        </div>

        <div id="modal">
            <div id="modal-content">
                <div id="modal-title">REWARD!</div>
                <div id="modal-body" style="font-size: 24px; margin-bottom: 20px;"></div>
                <button class="nav-btn" onclick="closeModal()">CLAIM</button>
            </div>
        </div>
    </div>

    <script>
        // Game State Database
        const brawlersDatabase = [
            { id: 'shelly', name: 'Shelly', rarity: 'Starting', unlocked: true, level: 1 },
            { id: 'colt', name: 'Colt', rarity: 'Rare', unlocked: false, level: 1 },
            { id: 'el_primo', name: 'El Primo', rarity: 'Rare', unlocked: false, level: 1 },
            { id: 'mortis', name: 'Mortis', rarity: 'Mythic', unlocked: false, level: 1 },
            { id: 'crow', name: 'Crow', rarity: 'Legendary', unlocked: false, level: 1 }
        ];

        let gameState = {
            coins: 100,
            gems: 10,
            brawlers: brawlersDatabase
        };

        // Initialize Game & Load Save Data
        function initGame() {
            const savedData = localStorage.getItem('brawlStarsSave');
            if (savedData) {
                gameState = JSON.parse(savedData);
            }
            updateUI();
        }

        // Save progress to LocalStorage
        function saveGame() {
            localStorage.setItem('brawlStarsSave', JSON.stringify(gameState));
        }

        // Navigation Tabs Engine
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            if (tabId === 'brawlers-tab') renderBrawlersList();
        }

        // Update Top Bar & Status Displays
        function updateUI() {
            document.getElementById('coins-display').innerText = gameState.coins;
            document.getElementById('gems-display').innerText = gameState.gems;

            const unlockedCount = gameState.brawlers.filter(b => b.unlocked).length;
            document.getElementById('unlocked-count').innerText = unlockedCount;
            saveGame();
        }

        // Open Drop Logic
        function openDrop(dropName) {
            const coinsEarned = Math.floor(Math.random() * 200) + 50;
            gameState.coins += coinsEarned;

            // Check for potential brawler unlock
            const lockedBrawlers = gameState.brawlers.filter(b => !b.unlocked);
            let unlockMessage = "";

            // 40% chance to unlock a new brawler if any are locked
            if (lockedBrawlers.length > 0 && Math.random() < 0.4) {
                const newBrawler = lockedBrawlers[Math.floor(Math.random() * lockedBrawlers.length)];
                newBrawler.unlocked = true;
                unlockMessage = `<br><span style="color: #00ffcc;">NEW BRAWLER UNLOCKED: ${newBrawler.name}!</span>`;
            }

            // Show Rewards Modal
            document.getElementById('modal-title').innerText = dropName.toUpperCase();
            document.getElementById('modal-body').innerHTML = `+${coinsEarned} Coins 🪙 ${unlockMessage}`;
            document.getElementById('modal').style.display = 'flex';

            updateUI();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Render Brawlers Collection Screen
        function renderBrawlersList() {
            const listContainer = document.getElementById('brawlers-list');
            listContainer.innerHTML = '';

            gameState.brawlers.forEach(brawler => {
                const card = document.createElement('div');
                card.style.cssText = `
                    background: ${brawler.unlocked ? 'rgba(0,128,0,0.6)' : 'rgba(100,100,100,0.4)'};
                    border: 2px solid #fff;
                    padding: 15px;
                    border-radius: 8px;
                    width: 140px;
                    text-align: center;
                `;
                card.innerHTML = `
                    <h3>${brawler.name}</h3>
                    <p>${brawler.unlocked ? 'Lvl ' + brawler.level : '🔒 Locked'}</p>
                    <p style="font-size:12px; color:#ddd;">${brawler.rarity}</p>
                `;
                listContainer.appendChild(card);
            });
        }

        // Run setup on load
        window.onload = initGame;
    </script>
</body>
</html>
